name: Build Android APK

# TwoHearts — Native Android build workflow.
# Builds the Kotlin/Jetpack Android application via Gradle and produces a debug APK.
#
# Technology stack:
# - Kotlin 2.1.0 + Jetpack Compose + Material 3
# - Room (SQLite) for persistence
# - Android SDK 35, AGP 8.7.3, Gradle 8.11
# - JDK 17 (Temurin)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      apk_id: ${{ steps.publish.outputs.artifact-id }}
      apk_url: ${{ steps.publish.outputs.artifact-url }}
      apk_archive_digest: ${{ steps.publish.outputs.artifact-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Build Android rehearsal tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon

      - name: Upload APK artifact
        id: publish
        uses: actions/upload-artifact@v4
        with:
          name: twohearts-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: twohearts-runtime-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  runtime-rehearsal:
    name: Android runtime (API ${{ matrix.api }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33, 35]
    env:
      UPGRADE_BASELINE: 7a44bccfa596585d37c5f5572efd4717510485d6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve published APK
        uses: actions/download-artifact@v4
        with:
          name: twohearts-debug-apk
          path: candidate

      - name: Retrieve instrumentation APK
        if: matrix.api == 33
        uses: actions/download-artifact@v4
        with:
          name: twohearts-runtime-test-apk
          path: candidate/test

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --settle --name-match=kvm
          if [ -c /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          else
            echo '::notice::KVM is unavailable on this runner. Trying software emulation.'
          fi

      - name: Ensure APK signature tools are available
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager 'build-tools;35.0.0'
          fi

      - name: Set up JDK 17 for baseline build
        if: matrix.api == 33
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle for baseline build
        if: matrix.api == 33
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signed upgrade pair
        if: matrix.api == 33
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$UPGRADE_BASELINE"
          git worktree add --detach "$RUNNER_TEMP/twohearts-baseline" "$UPGRADE_BASELINE"
          (cd "$RUNNER_TEMP/twohearts-baseline" && bash gradlew :app:assembleDebug --no-daemon)
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          key="$RUNNER_TEMP/twohearts-upgrade.jks"
          keytool -genkeypair -keystore "$key" -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -dname "CN=TwoHearts upgrade fixture" -alias fixture -validity 1
          "$signer" sign --ks "$key" --ks-key-alias fixture --ks-pass pass:android \
            --out "$RUNNER_TEMP/baseline.apk" "$RUNNER_TEMP/twohearts-baseline/app/build/outputs/apk/debug/app-debug.apk"
          "$signer" sign --ks "$key" --ks-key-alias fixture --ks-pass pass:android \
            --out "$RUNNER_TEMP/upgrade.apk" candidate/app-debug.apk
          for apk in "$RUNNER_TEMP/baseline.apk" "$RUNNER_TEMP/upgrade.apk"; do
            "$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          done > "$RUNNER_TEMP/upgrade-signers.txt"
          test "$(wc -l < "$RUNNER_TEMP/upgrade-signers.txt")" -eq 2
          test "$(sort -u "$RUNNER_TEMP/upgrade-signers.txt" | wc -l)" -eq 1

      - name: Record candidate identity
        run: |
          mkdir runtime-evidence
          printf '%s\n' "$GITHUB_SHA" > runtime-evidence/source-commit.txt
          sha256sum candidate/app-debug.apk > runtime-evidence/apk-sha256.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs candidate/app-debug.apk > runtime-evidence/apk-signature.txt
          if [ -f "$RUNNER_TEMP/upgrade-signers.txt" ]; then cp "$RUNNER_TEMP/upgrade-signers.txt" runtime-evidence/; fi

      - name: Install and exercise candidate
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/android-release-rehearsal.py candidate/app-debug.apk runtime-evidence --upgrade-fixtures "$RUNNER_TEMP" --instrumentation candidate/test/app-debug-androidTest.apk

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twohearts-runtime-api-${{ matrix.api }}
          path: runtime-evidence/
          if-no-files-found: warn
          retention-days: 30

  delivery-receipt:
    name: Verify Android delivery
    needs: [build-apk, runtime-rehearsal]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APK_ARTIFACT_ID: ${{ needs.build-apk.outputs.apk_id }}
      APK_ARTIFACT_URL: ${{ needs.build-apk.outputs.apk_url }}
      APK_ARCHIVE_DIGEST: ${{ needs.build-apk.outputs.apk_archive_digest }}

    steps:
      - name: Retrieve tested APK
        uses: actions/download-artifact@v4
        with:
          name: twohearts-debug-apk
          path: candidate

      - name: Retrieve emulator receipts
        uses: actions/download-artifact@v4
        with:
          pattern: twohearts-runtime-api-*
          path: rehearsal

      - name: Verify and record package identity
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$sdk_tools/apksigner" ]; then
            sdkmanager 'build-tools;35.0.0'
          fi
          apk=candidate/app-debug.apk
          unzip -tq "$apk"
          "$sdk_tools/zipalign" -c 4 "$apk"
          metadata=$("$sdk_tools/aapt" dump badging "$apk")
          signing=$("$sdk_tools/apksigner" verify --verbose --print-certs "$apk")
          apk_digest=$(sha256sum "$apk" | cut -d' ' -f1)
          for api in 26 33 35; do
            run="rehearsal/twohearts-runtime-api-$api"
            test "$(cat "$run/source-commit.txt")" = "$GITHUB_SHA"
            test "$(cut -d' ' -f1 "$run/apk-sha256.txt")" = "$apk_digest"
          done
          test -n "$APK_ARTIFACT_ID" && test -n "$APK_ARTIFACT_URL" && test -n "$APK_ARCHIVE_DIGEST"
          {
            printf '# TwoHearts APK delivery\n\n'
            printf -- '- Source commit `%s`\n' "$GITHUB_SHA"
            printf -- '- [Build Android APK](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- [twohearts-debug-apk](%s), artifact `%s`\n' "$APK_ARTIFACT_URL" "$APK_ARTIFACT_ID"
            printf -- '- Archive SHA-256 `%s`\n' "$APK_ARCHIVE_DIGEST"
            printf -- '- APK SHA-256 `%s`\n' "$apk_digest"
            printf -- '- Debug and release unit tests passed. Android runtime jobs passed on API 26, 33, and 35.\n'
            printf '\n```text\n'
            printf '%s\n' "$metadata" | grep -E '^package:|^sdkVersion:|^targetSdkVersion:|^launchable-activity:|^native-code:'
            printf '%s\n' "$signing" | grep -E '^Verified using v2|^Signer #1 certificate (DN|SHA-256 digest)'
            printf '```\n'
          } | tee ANDROID-DELIVERY.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish delivery receipt
        uses: actions/upload-artifact@v4
        with:
          name: twohearts-delivery-receipt
          path: ANDROID-DELIVERY.md
          if-no-files-found: error
          retention-days: 30
