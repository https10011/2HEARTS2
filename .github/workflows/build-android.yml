name: Build Android APK

# TwoHearts V1 — Android APK build workflow (MasterPrompt §61).
#
# Builds the React web bundle, syncs it into the Capacitor Android
# project via `cap sync`, then assembles a debug (and release-ready)
# APK using Gradle. No hosted website, no cloud build service, no
# proprietary deployment platform — the APK bundles all web assets for
# offline use.

on:
  push:
    branches: [master, main]
  workflow_dispatch: # Allow the owner to run the build manually from Actions.

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # 22.7+ required by the persistence test runner
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run persistence unit tests
        run: npm test

      - name: Build React production bundle
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Install Capacitor CLI
        run: npm install -D @capacitor/cli

      - name: Sync Capacitor (copy web assets + update plugins)
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: twohearts-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
