<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" fill="none">
  <!--
    TwoHearts — onboarding welcome photo (REPLACEABLE OWNER ASSET).
    MasterPrompt §20/§58: the owner may replace THIS FILE with their own
    artwork/photo-export (keep the same filename + a 720×560-ish aspect)
    and the First Launch screen updates without code changes.
    Default artwork: scrapbook collage in the official palette —
    burgundy #6A1B2B, cream #FDF6F0, blush #F6E1DE, rose #C9808B,
    beige #EDE0D4, charcoal #2B2420, champagne gold #C8A24B.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9D9B8"/>
      <stop offset="0.55" stop-color="#F2B8A0"/>
      <stop offset="1" stop-color="#E5988B"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9808B"/>
      <stop offset="1" stop-color="#8E3147"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAD3B8"/>
      <stop offset="1" stop-color="#D3AF87"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3D6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFF3D6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft grounding shadows -->
  <ellipse cx="300" cy="512" rx="220" ry="22" fill="#C9808B" opacity="0.18"/>
  <ellipse cx="520" cy="500" rx="150" ry="18" fill="#C9808B" opacity="0.14"/>

  <!-- polaroid B (back right): two mugs, warm evening -->
  <g transform="rotate(6 520 290)">
    <rect x="400" y="150" width="240" height="280" rx="10" fill="#FFFFFF" stroke="#EDE0D4" stroke-width="2"/>
    <rect x="416" y="166" width="208" height="212" rx="4" fill="url(#table)"/>
    <rect x="416" y="166" width="208" height="90" rx="4" fill="#F6E1DE"/>
    <circle cx="520" cy="210" r="34" fill="url(#sunGlow)"/>
    <!-- mug 1 (handle outward) -->
    <rect x="452" y="296" width="52" height="60" rx="10" fill="#FDF6F0" stroke="#C9808B" stroke-width="2.5"/>
    <path d="M452 310c-12 0-18 7-18 15s6 15 18 15" stroke="#C9808B" stroke-width="2.5" fill="none"/>
    <!-- mug 2 (handle outward) -->
    <rect x="536" y="296" width="52" height="60" rx="10" fill="#FDF6F0" stroke="#8E3147" stroke-width="2.5"/>
    <path d="M588 310c12 0 18 7 18 15s-6 15-18 15" stroke="#8E3147" stroke-width="2.5" fill="none"/>
    <!-- steam -->
    <path d="M470 284c-5-9 5-13 0-22M492 284c-5-9 5-13 0-22M554 284c-5-9 5-13 0-22M576 284c-5-9 5-13 0-22" stroke="#C9808B" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <!-- hearts between mugs -->
    <path d="M520 262c-6-8-18-4-18 4 0 7 10 12 18 18 8-6 18-11 18-18 0-8-12-12-18-4Z" fill="#8E3147"/>
  </g>

  <!-- polaroid A (front left): couple at sunset -->
  <g transform="rotate(-5 275 225)">
    <rect x="145" y="60" width="260" height="310" rx="10" fill="#FFFFFF" stroke="#EDE0D4" stroke-width="2"/>
    <rect x="161" y="76" width="228" height="238" rx="4" fill="url(#sky)"/>
    <!-- sun + reflection -->
    <circle cx="275" cy="170" r="26" fill="#FFF3D6"/>
    <circle cx="275" cy="170" r="44" fill="url(#sunGlow)"/>
    <rect x="161" y="208" width="228" height="106" rx="4" fill="url(#sea)"/>
    <path d="M161 208h228" stroke="#F9D9B8" stroke-width="3" opacity="0.8"/>
    <path d="M268 214h14M262 228h26M270 242h12M260 256h30M272 270h8" stroke="#FDF6F0" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <!-- shoreline -->
    <path d="M161 314c40-16 80-6 114-10s80-14 114-4v14H161Z" fill="#7A4A3A"/>
    <!-- couple silhouettes (from behind, sitting close) -->
    <g fill="#3A2620">
      <circle cx="252" cy="238" r="14"/>
      <path d="M230 304c0-26 10-44 22-44s22 18 22 44Z"/>
      <circle cx="300" cy="232" r="15"/>
      <path d="M276 304c0-28 11-48 24-48s24 20 24 48Z"/>
    </g>
    <!-- her hair falling onto her shoulders -->
    <path d="M236 234c-4 18-2 34 6 46 4-4 4-12 4-20l-2-26Z M268 234c4 18 2 34-6 46-4-4-4-12-4-20l2-26Z" fill="#2B1A14"/>
    <!-- caption strip -->
    <path d="M200 344h150" stroke="#EDE0D4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- rose sprig (right) -->
  <g transform="rotate(14 640 210)">
    <path d="M640 300c-6-40 4-80 12-108" stroke="#7C8A5A" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M638 262c-16-4-26-16-28-30 14 2 26 12 28 30Z" fill="#8A9A66"/>
    <path d="M644 240c16-6 30-2 38 8-14 4-30 0-38-8Z" fill="#7C8A5A"/>
    <!-- bud -->
    <path d="M652 192c-16-2-26 10-24 24 2 12 12 20 24 20s22-8 24-20c2-14-8-22-24-24Z" fill="#C9808B"/>
    <path d="M652 200c-9-1-15 6-14 14 1 8 8 12 14 12s13-4 14-12c1-8-5-13-14-14Z" fill="#B86A77"/>
    <path d="M652 208c-5 0-8 3-8 7s3 7 8 7 8-3 8-7-3-7-8-7Z" fill="#8E3147"/>
    <path d="M640 236c4 6 20 6 24 0l-4 10h-16Z" fill="#7C8A5A"/>
  </g>

  <!-- small baby's-breath sprigs -->
  <g stroke="#C9808B" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M688 340c4-22 12-38 24-50M700 344c8-18 20-30 34-36" fill="none"/>
  </g>
  <g fill="#F6E1DE" stroke="#C9808B" stroke-width="1.5">
    <circle cx="712" cy="290" r="5"/><circle cx="724" cy="300" r="4.5"/><circle cx="736" cy="306" r="4"/>
    <circle cx="704" cy="306" r="4"/><circle cx="716" cy="318" r="4.5"/><circle cx="730" cy="322" r="4"/>
  </g>

  <!-- pinned note -->
  <g transform="rotate(-11 130 360)">
    <rect x="60" y="312" width="150" height="112" rx="6" fill="#FFFDF9" stroke="#EDE0D4" stroke-width="2"/>
    <circle cx="135" cy="316" r="9" fill="#C8A24B"/>
    <circle cx="132" cy="313" r="3" fill="#E9D5A3"/>
    <text x="135" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#6A1B2B">the little things</text>
    <text x="135" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#6A1B2B">we love most</text>
  </g>

  <!-- envelope with wax seal -->
  <g>
    <rect x="240" y="368" width="300" height="150" rx="10" fill="#FDF6F0" stroke="#E4D2C2" stroke-width="2"/>
    <path d="M240 380 390 452 540 380" stroke="#E4D2C2" stroke-width="2" fill="none"/>
    <path d="M240 506 350 440M540 506 430 440" stroke="#EFE0D2" stroke-width="2" fill="none"/>
    <!-- wax seal -->
    <circle cx="390" cy="452" r="34" fill="#6A1B2B"/>
    <circle cx="390" cy="452" r="34" fill="none" stroke="#4A0F1D" stroke-width="2"/>
    <circle cx="390" cy="452" r="27" fill="none" stroke="#8E3147" stroke-width="1.5"/>
    <!-- gold branch emblem -->
    <g stroke="#D8B25C" stroke-width="2.4" stroke-linecap="round" fill="none">
      <path d="M390 470c0-14 0-24 0-34"/>
      <path d="M390 462c-6-2-10-6-12-12M390 462c6-2 10-6 12-12M390 452c-5-2-8-5-10-10M390 452c5-2 8-5 10-10M390 442c-4-1-6-4-8-8M390 442c4-1 6-4 8-8"/>
    </g>
    <circle cx="390" cy="434" r="2.6" fill="#D8B25C"/>
  </g>

  <!-- tiny heart above seal -->
  <path d="M390 340c-4-5-12-3-12 2 0 5 7 8 12 12 5-4 12-7 12-12 0-5-8-7-12-2Z" fill="#C9808B"/>
</svg>
